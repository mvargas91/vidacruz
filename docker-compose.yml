services:
  redis:
    image: redis:7.4.1-alpine
    restart: always
    container_name: vidacruz-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass mvargas
    networks:
      - vidacruz-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: always
    container_name: vidacruz-redis-ui
    environment:
      - REDIS_HOSTS=local:redis:6379:0:mvargas
      - HTTP_USER=admin
      - HTTP_PASSWORD=mvargas
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - vidacruz-network

  postgres:
    image: postgres:17.5
    container_name: vidacruz-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mvargas
      POSTGRES_DB: vidacruz
    volumes:
      - ./db/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - vidacruz-network

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - vidacruz-network

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists
      --topic triaje.eventos
      --partitions 3
      --replication-factor 1
      --bootstrap-server kafka:29092
    restart: "no"
    networks:
      - vidacruz-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - vidacruz-network

networks:
  vidacruz-network:
    driver: bridge

volumes:
  kafka-data: