spring:
  application:
    name: service-triage
  r2dbc:
    url: 'r2dbc:postgresql://localhost:5432/vidacruz'
    username: admin
    password: mvargas
    pool:
      enabled: true
      initial-size: 15
      max-size: 30
      max-life-time: 180000ms
      max-idle-time: 100000ms
      max-create-connection-time: 10000ms
      validation-depth: local
      validation-query: SELECT 1
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092
          producer-properties:
            key.serializer: org.apache.kafka.common.serialization.StringSerializer
            value.serializer: org.apache.kafka.common.serialization.StringSerializer
            acks: all
            enable.idempotence: true
        bindings:
          triajeEventos-out-0:
            producer:
              sync: true # send() espera confirmación de Kafka y falla si no llega
      bindings:
        triajeEventos-out-0:
          destination: triaje.eventos
          producer:
            use-native-encoding: true # evita que el JSON (ya en String) se serialice dos veces

outbox:
  poll-interval-ms: 1000