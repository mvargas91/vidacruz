server:
  port: 9090

spring:
  application:
    name: clinical-assistant
  r2dbc:
    url: 'r2dbc:postgresql://localhost:5432/vidacruz'
    username: admin
    password: mvargas
    pool:
      enabled: true
      initial-size: 15
      max-size: 30
      max-life-time: 180000ms
      max-idle-time: 100000ms
      max-create-connection-time: 10000ms
      validation-depth: local
      validation-query: SELECT 1
  cloud:
    function:
      definition: triajeEventos
    stream:
      bindings:
        triajeEventos-out-0:
          destination: triaje.eventos
          content-type: application/json
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
          required-acks: all
        bindings:
          triajeEventos-out-0:
            producer:
              message-key-expression: headers['kafka_messageKey']
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
                enable.idempotence: true
                linger.ms: 5
                client.id: triage-service