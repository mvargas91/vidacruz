server:
  port: 9090

# RF-03: sla and interval are configurable : PT30S, PT2S
app:
  triage:
    evaluation-interval: PT30S      # in test: PT2S
    sla:
      CRITICO: PT5M                 # in test: PT10S
      URGENTE: PT10M
      URGENTE_2: PT30M
      NO_URGENTE: PT60M
      NO_URGENTE_2: PT120M

spring:
  application:
    name: clinical-assistant
  r2dbc:
    url: 'r2dbc:postgresql://localhost:5432/vidacruz'
    username: admin
    password: mvargas
    pool:
      enabled: true
      initial-size: 15
      max-size: 30
      max-life-time: 180000ms
      max-idle-time: 100000ms
      max-create-connection-time: 10000ms
      validation-depth: local
      validation-query: SELECT 1
  data:
    redis:
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
      host: localhost
      port: 6379
      password: mvargas
      connect-timeout: 2000ms
      username: default

  cloud:
    function:
      definition: eventTriageSupplier;eventTriageConsumer
    stream:
      # 1. Bindings generales (Aquí se mapea al topic real)
      bindings:
        eventTriageSupplier-out-0:
          destination: triaje.eventos
          content-type: application/json
        eventTriageConsumer-in-0:
          destination: triaje.eventos
          group: grupo-triaje # Obligatorio para que no pierda mensajes al reiniciar
          content-type: application/json
          consumer:
            concurrency: 1
            max-attempts: 3
      # 2. Configuración específica del Binder de Kafka
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
          auto-create-topics: true
          producer-properties:
            acks: all
            enable.idempotence: true
          consumer-properties:
            auto.offset.reset: earliest
        bindings:
          eventTriageSupplier-out-0:
            producer:
              message-key-expression: headers['kafka_messageKey']
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
                linger.ms: 5
                client.id: triage-service

logging:
  level:
    org.springframework.cloud.stream: DEBUG
    org.springframework.kafka: INFO